spring.datasource.driver-class-name=io.opentelemetry.instrumentation.jdbc.OpenTelemetryDriver
spring.datasource.url=jdbc:postgresql://localhost:5432/pgr
spring.datasource.username=postgres
spring.datasource.password=postgres

#Set context root
server.port = 8082
server.context-path=/common-persist
server.servlet.context-path=/common-persist


#----------------------------- FLYWAY CONFIGURATIONS ------------------------------#
spring.flyway.url=jdbc:postgresql://localhost:5432/pgr
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.table=public
spring.flyway.baseline-on-migrate=true
spring.flyway.outOfOrder=true
spring.flyway.locations=db/migration/main
spring.flyway.enabled=false

# KAFKA SERVER CONFIGURATIONS
kafka.config.bootstrap_server_config=localhost:9092

# KAFKA CONSUMER CONFIGURATIONS
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=egov-infra-persist
spring.kafka.consumer.auto_commit=true
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto_commit_interval=100
spring.kafka.consumer.session_timeout_ms_config=15000
spring.kafka.consumer.auto_offset_reset=earliest
spring.kafka.consumer.properties.spring.json.use.type.headers=false


# KAFKA PRODUCER CONFIGURATIONS
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


#----------Localization topic names------------
kafka.topics.create.message=egov-message-create
#--------------------------------------------------------------
#egov.persist.yml.repo.path=classpath:pg-service-persister.yml
egov.persist.yml.repo.path=https://raw.githubusercontent.com/egovernments/configs/DEV/egov-persister/tradelicense-persister.yml
#logging.level.org.egov.infra.persist.repository=DEBUG
tracer.kafkaMessageLoggingEnabled=true
tracer.errorsTopic=egov-persister-deadletter
tracer.errorsPublish=true

persister.bulk.enabled=false
persister.batch.size=100
# Comma-separated list of topics to be processed in batch mode
# Topics containing "-batch" in name are automatically included
persister.batch.topics=

default.version=1.0.0

# Audit integration configs
audit.persist.kafka.topic=audit-create
audit.generate.kafka.topic=process-audit-records

# Listener-task-executor on a single KafkaMessageListenerContainer does not parallelise records and
# can interfere with per-record ack ordering; left off.
persister.custom.executor.enabled=false
persister.custom.executor.max-pool-size=10

# Thread pool size for parallel topic processing within a batch
persister.batch.parallel-topic-processing.thread-pool-size=1

persister.dead-letter.reprocess.enabled=true
persister.dead-letter.reprocess.error-topic=egov-persister-deadletter-processed
# Bounded DLQ retries before a record is moved to the terminal parking topic (R4 - no infinite loop).
persister.dead-letter.max-retries=5

# Pause the consumer while the datasource is unreachable and resume when it recovers, so transient
# failures retry in place instead of hammering a dead DB (pause-on-DB-health backstop).
persister.db-health.check-interval-ms=5000

# DLQ / parking producer reliability (durable, no-loss publishes).
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

otel.traces.exporter=otlp
otel.service.name=egov-persister
otel.logs.exporter=none
otel.metrics.exporter=none
otel.exporter.otlp.endpoint=http://jaeger-collector.tracing:4318
otel.exporter.otlp.protocol=http/protobuf
otel.instrumentation.kafka.enabled=true
otel.instrumentation.kafka.experimental-span-attributes=true
otel.instrumentation.http.server.ignore-urls=/egov-persister/health,/egov-persister/promethus