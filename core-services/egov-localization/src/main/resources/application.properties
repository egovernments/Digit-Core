spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database=postgresql

spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.outOfOrder=true
spring.flyway.table=egov_localization_schema_version
spring.flyway.baseline-on-migrate=true
spring.flyway.url=jdbc:postgresql://localhost:5432/devdb
spring.flyway.locations=classpath:/db/migration/ddl
spring.flyway.enabled=false

spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/devdb

server.port=8087
server.context-path=/localization
server.servlet.context-path=/localization


logging.pattern.console=%clr(%X{CORRELATION_ID:-}) %clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

spring.redis.host=localhost
spring.redis.port=6379

app.timezone=UTC

localization.search.module.absent.max.messages=200000
localization.cache.max.entry.bytes=10485760

localization.upsert.async.enabled=true
localization.upsert.topic=save-localization-messages
localization.upsert.reply.topic=localization-upsert-reply
localization.upsert.reply.timeout.ms=60000
# On queue failure, fall back to the direct write and skip Kafka for this long, so a broker
# outage costs ONE reply timeout rather than one per request.
localization.upsert.degraded.cooldown.ms=30000
# Bound how long a send may block on metadata when the broker is unreachable, so the FIRST
# request of an outage fails over quickly instead of stalling on Kafka's 60s default.
localization.upsert.producer.max.block.ms=10000
localization.upsert.producer.request.timeout.ms=15000
localization.upsert.consumer.group=egov-localization-upsert
localization.upsert.consumer.batch.size=10
# Both topics are created by the service at startup if absent, so turning the flag on
# is the only step needed - there is no separate topic-provisioning task to forget.
localization.upsert.topic.partitions=3
localization.upsert.topic.replication.factor=1
spring.kafka.bootstrap-servers=localhost:9092

# JDBC batching: without it saveAll() issues one round trip per row (~12% measured).
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
