server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: notify-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notify}
    username: ${SPRING_DATASOURCE_USERNAME:notify}
    password: ${SPRING_DATASOURCE_PASSWORD:notify}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: notify-hikari
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

notify:
  plugins:
    directory: ${NOTIFY_PLUGINS_DIR:/providers}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
