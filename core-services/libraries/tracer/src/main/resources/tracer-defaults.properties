# Defaults loaded by TracerAutoConfiguration consumers.
# Override any of these in your service's application.properties.

digit.tracer.request-logging-enabled=false
digit.tracer.kafka-message-logging-enabled=false
digit.tracer.errors-publish=false
digit.tracer.errors-topic=digit-error
digit.tracer.error-details-topic=error-details-indexer-topic
digit.tracer.should-publish-error-details=false

digit.tracer.pubsub.type=kafka
digit.tracer.pubsub.kafka.brokers=localhost:9092
digit.tracer.pubsub.kafka.consumer-group=digit-default
digit.tracer.pubsub.kafka.default-partitions=3
digit.tracer.pubsub.kafka.default-replication-factor=1

digit.tracer.pubsub.redis.address=localhost:6379
digit.tracer.pubsub.redis.consumer-group=digit-default

digit.tracer.otel.enabled=true
digit.tracer.otel.endpoint=http://localhost:4318
digit.tracer.otel.sampling-ratio=1.0
digit.tracer.otel.service-name=${spring.application.name:unknown-service}
digit.tracer.otel.service-version=unknown

digit.tracer.db.tracing-enabled=true
