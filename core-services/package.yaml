schema-version: 1

# Bundles declare which services get composed into which deployable artifacts.
# The digit-bundler-maven-plugin reads this file and generates bundles/<name>/
# containing a Spring Boot pom + main class + application.properties.
bundles:

  # A monolith bundling idgen + mdms into one Spring Boot process.
  # The bundler auto-sets egov.mdms.mode=local because both consumer (idgen)
  # and provider (egov-mdms-service) live in the same bundle.
  idgen-monolith:
    type: monolith
    include: [egov-idgen, egov-mdms-service]
    spring-profiles: [monolith]
    server:
      port: 8080
    properties:
      # NOTE: egov.mdms.conf.path is consumed via `new File(path)` — must be a plain
      # filesystem path, NOT a file:// URI (unlike masters.config.url which uses Spring's
      # ResourceLoader and does accept file:// URIs).
      egov.mdms.conf.path: /Users/aniket/Documents/egov-mdms-data/data/pb
      masters.config.url: file:///Users/aniket/Documents/egov-mdms-data/master-config.json
      spring.datasource.url: jdbc:postgresql://localhost:5432/rainmaker_new
      spring.datasource.username: postgres
      spring.datasource.password: postgres
      spring.datasource.driver-class-name: org.postgresql.Driver
      otel.traces.exporter: none
      otel.instrumentation.kafka.enabled: false
      # idgen: allow auto-creation of Postgres sequences referenced by
      # MDMS-driven IdFormat entries. Without this, generateSequenceNumber
      # returns an empty list on missing sequences and getFormattedId's
      # subsequent .get(0) throws IndexOutOfBoundsException.
      autocreate.new.seq: true
      # Kafka — no broker running for this PoC. spring-kafka auto-config is on the
      # classpath (bundler pulled it in because both services declared kafka-consumer),
      # but disable admin/health probes so absent broker doesn't fail startup. Real
      # deployments would point spring.kafka.bootstrap-servers at a live cluster.
      spring.kafka.bootstrap-servers: localhost:9092
      spring.kafka.admin.fail-fast: false
      spring.kafka.listener.missing-topics-fatal: false
      management.health.kafka.enabled: false
      # Per-service consumer group ids — read by the bundler-generated
      # MonolithKafkaConfig via @Value on the corresponding container-factory bean.
      # Consumer group IDs — deliberately service-scoped so they're visually
      # distinct in Kafka's broker view, kafka-consumer-groups CLI, etc.
      idgen.kafka.group-id: egov-idgen-consumers
      mdms.kafka.group-id: egov-mdms-service-consumers
      # Enable the demo Kafka listeners shipped by each service. Standalone runs
      # leave this off, so no broker connection is attempted when the service
      # boots alone.
      egov.kafka.demo: true
