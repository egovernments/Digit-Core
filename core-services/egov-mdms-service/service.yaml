schema-version: 1
name: egov-mdms-service
scan-base-packages:
  - org.egov
  - org.egov.infra.mdms
context-path: /egov-mdms-service
main-class-hint: org.egov.MDMSApplication
defaults-file: mdms-defaults.properties
provides:
  - capability: mdms
    local-value: local
    http-value: http
consumes: []

# Hypothetical — same rationale as idgen's; mdms doesn't ship a real @KafkaListener
# yet. Bundler emits a distinct container factory + group.id for any future listener
# under org.egov.infra.mdms.*.
kafka-consumer:
  package-prefix: org.egov.infra.mdms
  group-id-property: mdms.kafka.group-id
