schema-version: 1
name: egov-idgen
scan-base-packages:
  - org.egov
  - org.egov.id
context-path: /egov-idgen
main-class-hint: org.egov.PtIdGenerationApplication
defaults-file: idgen-defaults.properties
provides: []
consumes:
  - capability: mdms
    switch-property: egov.mdms.mode

# Hypothetical — idgen doesn't have real @KafkaListener today, but the declaration
# proves the bundler wires per-service consumer groups. When idgen adds a listener
# under org.egov.id.*, it will land in this group.
kafka-consumer:
  package-prefix: org.egov.id
  group-id-property: idgen.kafka.group-id
